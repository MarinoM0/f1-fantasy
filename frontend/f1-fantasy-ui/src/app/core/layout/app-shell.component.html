<div class="shell" [class.shell--auth]="isAuthRoute()" [class.shell--fantasy]="isFantasyRoute()">
    <header class="shell__header" [class.shell__header--auth]="isAuthRoute()">
        <div class="shell__brand">
            <img src="assets/images/f1-logo.svg" alt="F1 Fantasy logo" class="shell__logo" />
            <a routerLink="/dashboard" (click)="closeNav()">Fantasy</a>
        </div>

        <button
            class="shell__menu-toggle"
            type="button"
            [attr.aria-expanded]="isNavOpen()"
            aria-label="Toggle navigation"
            (click)="toggleNav()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="shell__nav" [class.shell__nav--open]="isNavOpen()">
            <div class="shell__nav-group shell__nav-group--main">
                <a class="shell__nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="closeNav()">Dashboard</a>
                <a class="shell__nav-link" routerLink="/team-builder" routerLinkActive="active" (click)="closeNav()">Team Builder</a>
                @if (isAuthenticated()) {
                    <a class="shell__nav-link" routerLink="/my-team" routerLinkActive="active" (click)="closeNav()">My Team</a>
                    <a class="shell__nav-link" routerLink="/leagues" routerLinkActive="active" (click)="closeNav()">Leagues</a>
                    <a class="shell__nav-link" routerLink="/predictions" routerLinkActive="active" (click)="closeNav()">Predictions</a>     
                }
            </div>
            @if (!isAuthenticated()) {
                <div class="shell__nav-group shell__nav-group--auth">
                    <a
                        class="shell__nav-link shell__nav-link--muted"
                        routerLink="/login"
                        routerLinkActive="active"
                        (click)="closeNav()">Login</a>
                    <a
                        class="shell__nav-link shell__nav-link--cta"
                        routerLink="/register"
                        routerLinkActive="active"
                        (click)="closeNav()">Register</a>
                </div>
            } @else {
                <div class="shell__nav-group shell__nav-group--user">
                    <span class="shell__user-name">{{ currentUser()?.username }}</span>
                    <button class="shell__nav-button" type="button" (click)="logout(); closeNav()">Logout</button>
                </div>
            }
        </nav>
    </header>

    <main class="shell__content" [class.shell__content--auth]="isAuthRoute()">
        <router-outlet />
    </main>
</div>
